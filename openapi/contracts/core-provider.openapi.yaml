openapi: 3.0.3
info:
  title: RERUM Core Provider Contract
  version: 1.0.0
  description: Provider-maintained baseline for the core RERUM API surface.
servers:
  - url: https://store.rerum.io/v1
paths:
  /api:
    get:
      summary: Describe the core API endpoints
      operationId: describeCoreApi
      responses:
        '200':
          description: Available endpoint summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /id/{id}:
    get:
      summary: Read object by id
      operationId: getObjectById
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Object payload
          headers:
            Cache-Control:
              $ref: '#/components/headers/RecordCacheControl'
            Last-Modified:
              $ref: '#/components/headers/RecordLastModified'
            Location:
              $ref: '#/components/headers/CanonicalLocation'
            Current-Overwritten-Version:
              $ref: '#/components/headers/CurrentOverwrittenVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '404':
          $ref: '#/components/responses/NotFound'
    head:
      summary: Read object headers by id
      operationId: headObjectById
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Object headers
          headers:
            Cache-Control:
              $ref: '#/components/headers/RecordCacheControl'
            Last-Modified:
              $ref: '#/components/headers/RecordLastModified'
            Location:
              $ref: '#/components/headers/CanonicalLocation'
            Current-Overwritten-Version:
              $ref: '#/components/headers/CurrentOverwrittenVersion'
        '404':
          $ref: '#/components/responses/NotFound'
  /id/{id}/expanded:
    get:
      summary: Read object by id with its current Annotations merged in
      operationId: getExpandedObjectById
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/ExpansionGenerator'
        - $ref: '#/components/parameters/ExpansionCreator'
      responses:
        '200':
          description: >-
            Expanded object payload. A deleted record is returned as stored, with no expansion.
          headers:
            Annotations-Gathered:
              $ref: '#/components/headers/AnnotationsGathered'
            Annotations-Merged:
              $ref: '#/components/headers/AnnotationsMerged'
            Cache-Control:
              $ref: '#/components/headers/ExpansionCacheControl'
            Location:
              $ref: '#/components/headers/CanonicalLocation'
            Current-Overwritten-Version:
              $ref: '#/components/headers/CurrentOverwrittenVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Method not allowed — this endpoint only permits GET, HEAD, and POST.
    head:
      summary: Read expanded object headers by id
      operationId: headExpandedObjectById
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/ExpansionGenerator'
        - $ref: '#/components/parameters/ExpansionCreator'
      responses:
        '200':
          description: >-
            Expanded object headers. A deleted record is returned as stored, with no expansion.
          headers:
            Annotations-Gathered:
              $ref: '#/components/headers/AnnotationsGathered'
            Annotations-Merged:
              $ref: '#/components/headers/AnnotationsMerged'
            Cache-Control:
              $ref: '#/components/headers/ExpansionCacheControl'
            Location:
              $ref: '#/components/headers/CanonicalLocation'
            Current-Overwritten-Version:
              $ref: '#/components/headers/CurrentOverwrittenVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Method not allowed — this endpoint only permits GET, HEAD, and POST.
    post:
      summary: Read object by id with its current Annotations merged in, filtered by the request body
      operationId: postExpandedObjectById
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: >-
            Expanded object payload. A deleted record is returned as stored, with no expansion.
          headers:
            Annotations-Gathered:
              $ref: '#/components/headers/AnnotationsGathered'
            Annotations-Merged:
              $ref: '#/components/headers/AnnotationsMerged'
            Location:
              $ref: '#/components/headers/CanonicalLocation'
            Current-Overwritten-Version:
              $ref: '#/components/headers/CurrentOverwrittenVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Method not allowed — this endpoint only permits GET, HEAD, and POST.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /since/{id}:
    get:
      summary: Read updates since id
      operationId: getSince
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Incremental updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '404':
          $ref: '#/components/responses/NotFound'
    head:
      summary: Read update headers since id
      operationId: headSince
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Incremental update headers
        '404':
          $ref: '#/components/responses/NotFound'
  /history/{id}:
    get:
      summary: Read object history by id
      operationId: getHistory
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '404':
          $ref: '#/components/responses/NotFound'
    head:
      summary: Read object history headers by id
      operationId: headHistory
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Version history headers
        '404':
          $ref: '#/components/responses/NotFound'
  /api/query:
    post:
      summary: Query objects
      operationId: queryObjects
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageSkip'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: >-
            Query results, in ascending '_id' order.  Objects whose '_id' is not a string are not
            served.
          headers:
            Link:
              $ref: '#/components/headers/NextPageLink'
            Pagination-Limit:
              $ref: '#/components/headers/PaginationLimit'
            Pagination-Skip:
              $ref: '#/components/headers/PaginationSkip'
            Pagination-Limit-Max:
              $ref: '#/components/headers/PaginationLimitMax'
            Pagination-Skip-Max:
              $ref: '#/components/headers/PaginationSkipMax'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '400':
          $ref: '#/components/responses/PageBadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/search:
    post:
      summary: Search objects by keywords
      operationId: searchObjects
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageSkip'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: >-
            Search results, in descending relevance score order.  Objects whose '_id' is not a
            string are not served.
          headers:
            Link:
              $ref: '#/components/headers/NextPageLink'
            Pagination-Limit:
              $ref: '#/components/headers/PaginationLimit'
            Pagination-Skip:
              $ref: '#/components/headers/PaginationSkip'
            Pagination-Limit-Max:
              $ref: '#/components/headers/PaginationLimitMax'
            Pagination-Skip-Max:
              $ref: '#/components/headers/PaginationSkipMax'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '400':
          $ref: '#/components/responses/PageBadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/search/phrase:
    post:
      summary: Search objects by phrase
      operationId: searchObjectsByPhrase
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageSkip'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: >-
            Phrase search results, in descending relevance score order.  Objects whose '_id' is not
            a string are not served.
          headers:
            Link:
              $ref: '#/components/headers/NextPageLink'
            Pagination-Limit:
              $ref: '#/components/headers/PaginationLimit'
            Pagination-Skip:
              $ref: '#/components/headers/PaginationSkip'
            Pagination-Limit-Max:
              $ref: '#/components/headers/PaginationLimitMax'
            Pagination-Skip-Max:
              $ref: '#/components/headers/PaginationSkipMax'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '400':
          $ref: '#/components/responses/PageBadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/create:
    post:
      summary: Create object
      operationId: createObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          description: Created object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/bulkCreate:
    post:
      summary: Create multiple objects
      operationId: bulkCreateObjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericArray'
      responses:
        '201':
          description: Created objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/update:
    put:
      summary: Update object
      operationId: updateObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Updated object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/bulkUpdate:
    put:
      summary: Update multiple objects
      operationId: bulkUpdateObjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericArray'
      responses:
        '200':
          description: Updated objects. Items that were not found or were already deleted are silently skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericArray'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/overwrite:
    put:
      summary: Overwrite object
      operationId: overwriteObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Overwritten object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/patch:
    patch:
      summary: Patch object
      operationId: patchObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Patched object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      summary: Patch object via override-compatible POST
      operationId: patchObjectViaPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Patched object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Method not allowed — POST is only permitted with X-HTTP-Method-Override.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/set:
    patch:
      summary: Add properties to object
      operationId: setObjectProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Updated object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      summary: Add properties to object via override-compatible POST
      operationId: setObjectPropertiesViaPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Updated object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Method not allowed — POST is only permitted with X-HTTP-Method-Override.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/unset:
    patch:
      summary: Remove properties from object
      operationId: unsetObjectProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Updated object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      summary: Remove properties from object via override-compatible POST
      operationId: unsetObjectPropertiesViaPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Updated object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Method not allowed — POST is only permitted with X-HTTP-Method-Override.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/delete/{id}:
    delete:
      summary: Delete object by id
      operationId: deleteObjectById
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '204':
          description: Object marked deleted; no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/release/{id}:
    patch:
      summary: Release object by id
      operationId: releaseObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Release result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  headers:
    AnnotationsGathered:
      description: >-
        How many current Annotations targeting the entity were gathered for this expansion.
      schema:
        type: integer
        minimum: 0
    AnnotationsMerged:
      description: >-
        How many of the gathered Annotations could contribute an assertion.
      schema:
        type: integer
        minimum: 0
    ExpansionCacheControl:
      description: >-
        Browser caching policy for the expanded entity. An entity's Annotations are volatile while it
        is first created and stable afterward, so the expansion is cacheable for 24 hours.
      schema:
        type: string
        example: max-age=86400, must-revalidate
    RecordCacheControl:
      description: >-
        Browser caching policy for the record. A record is only replaced by an update, which mints a
        new URI, so the response at this URI is cacheable for 24 hours.
      schema:
        type: string
        example: max-age=86400, must-revalidate
    RecordLastModified:
      description: >-
        The record's '__rerum.isOverwritten' time, or its '__rerum.createdAt' time when it has never
        been overwritten, so a client can revalidate with 'If-Modified-Since'.
      schema:
        type: string
        format: date-time
    CanonicalLocation:
      description: >-
        The canonical URI of the record, in its '_id' form. A request made by Slug is answered with
        the stable '_id' URI here rather than the Slug it was asked for.
      schema:
        type: string
    CurrentOverwrittenVersion:
      description: >-
        The record's '__rerum.isOverwritten' value, for optimistic locking. Empty when the record has
        never been overwritten.
      schema:
        type: string
    NextPageLink:
      description: >-
        RFC 8288 links. The JSON-LD context link, plus rel="next" only while another page exists, so
        its absence ends a walk.
      schema:
        type: string
        example: >-
          <http://store.rerum.io/v1/context.json>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json",
          <https://store.rerum.io/v1/api/query?limit=100&skip=200>; rel="next"
    PaginationLimit:
      description: >-
        The 'limit' applied to this page, after any reduction to the maximum.  Read it rather than
        assuming the requested 'limit' was served.
      schema:
        type: integer
        minimum: 1
    PaginationSkip:
      description: >-
        The 'skip' applied to this page.
      schema:
        type: integer
        minimum: 0
    PaginationLimitMax:
      description: >-
        The largest 'limit' served.  A larger 'limit' is reduced to it.
      schema:
        type: integer
        minimum: 1
        example: 500
    PaginationSkipMax:
      description: >-
        The largest 'skip' accepted.  A larger 'skip' is a 400.
      schema:
        type: integer
        minimum: 1
        example: 100000
  parameters:
    ObjectId:
      in: path
      name: id
      required: true
      schema:
        type: string
    ExpansionGenerator:
      in: query
      name: generator
      required: false
      description: Only expand with Annotations generated by this registered app agent.
      schema:
        type: string
    ExpansionCreator:
      in: query
      name: creator
      required: false
      description: Only expand with Annotations attributed to this creator.
      schema:
        type: string
    PageLimit:
      in: query
      name: limit
      required: false
      description: >-
        How many records to serve, as a whole number in plain decimal digits. A 'limit'
        larger than 500 is reduced to 500 rather than rejected.
      schema:
        type: integer
        minimum: 1
        default: 100
    PageSkip:
      in: query
      name: skip
      required: false
      description: >-
        How many records to pass over before the page starts, as a whole number in plain decimal
        digits.  A 'skip' beyond 100000 is rejected with a 400.
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    GenericArray:
      type: array
      items:
        $ref: '#/components/schemas/GenericObject'
  responses:
    BadRequest:
      description: Bad request — the request body was missing, empty, or otherwise invalid.
    PageBadRequest:
      description: >-
        The request body was malformed.  It could also mean the 'limit' or 'skip' URL parameter 
        was malformed or beyond the maximum.
      headers:
        Pagination-Limit-Max:
          $ref: '#/components/headers/PaginationLimitMax'
        Pagination-Skip-Max:
          $ref: '#/components/headers/PaginationSkipMax'
    Unauthorized:
      description: Unauthorized — missing, malformed, or invalid bearer token.
    Forbidden:
      description: Forbidden — the target object is deleted, released, or not owned by the requesting agent.
    NotFound:
      description: Not found — no object exists for the supplied id.
    Conflict:
      description: Conflict — the supplied optimistic-lock version does not match the current object version.
    PayloadTooLarge:
      description: Payload too large — the request body exceeded the configured size limit.
    UnsupportedMediaType:
      description: Unsupported media type — the Content-Type header was not acceptable for this endpoint.
    NotImplemented:
      description: Not implemented — operating on a non-RERUM object via this endpoint is not yet supported.
    ServiceUnavailable:
      description: Service unavailable — the server is in maintenance or read-only mode.
